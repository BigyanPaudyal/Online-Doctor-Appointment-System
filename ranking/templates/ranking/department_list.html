<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Choose Department</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f5f0; --card: #ffffff; --primary: #1a4f6e;
      --accent: #e8622a; --text: #1c1c1e; --muted: #6b7280; --border: #e5e7eb;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); }
    header { background: var(--primary); padding: 1.5rem 2rem; display: flex; align-items: center; gap: 1rem; }
    header h1 { font-family: 'DM Serif Display', serif; color: white; font-size: 1.5rem; font-weight: 400; }
    header span { color: #93c5fd; font-size: 0.875rem; }
    .container { max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem; }
    .page-title { font-family: 'DM Serif Display', serif; font-size: 2.25rem; color: var(--primary); margin-bottom: 0.5rem; }
    .page-subtitle { color: var(--muted); font-size: 1rem; margin-bottom: 2.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .dept-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 1.5rem;
      text-decoration: none; color: var(--text); display: flex; flex-direction: column; gap: 0.5rem; transition: all 0.2s ease; }
    .dept-card:hover { border-color: var(--primary); box-shadow: 0 4px 20px rgba(26,79,110,0.12); transform: translateY(-2px); }
    .dept-icon { width: 42px; height: 42px; background: #e8f4f8; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin-bottom: 0.25rem; }
    .dept-name { font-weight: 600; font-size: 0.95rem; line-height: 1.3; }
    .dept-arrow { margin-top: auto; color: var(--accent); font-size: 1.1rem; font-weight: 700; }
  </style>
</head>
<body>
<header>
  <h1>🏥 Online Doctor Appointment System</h1>
  <span>Online Appointment System</span>
</header>
<div class="container">
  <h2 class="page-title">Select a Department</h2>
  <p class="page-subtitle">Choose the medical department to find and book a doctor.</p>
  <div class="grid">
    {% for dept in departments %}
    <a class="dept-card" href="{% url 'doctor_list' dept %}">
      <div class="dept-icon">🩺</div>
      <div class="dept-name">{{ dept }}</div>
      <div class="dept-arrow">→</div>
    </a>
    {% empty %}
    <p>No departments available at the moment.</p>
    {% endfor %}
  </div>
</div>
</body>
</html>
